name: "CodeQL Advanced"

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/**'
  push:
    branches: [ "master" ]
  schedule:
    # Weekly schedule
    - cron: '43 7 * * 1'

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: "Run CodeQL"
    uses: govuk-pay/pay-ci/.github/workflows/_run-codeql-scan.yml@67c10bdec6dad03624cee4ab798578e1ea429b97
    with:
      is_java_repo: true
